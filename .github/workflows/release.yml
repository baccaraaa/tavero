name: Release

# A version tag (v0.6.0) publishes that version to npm through Trusted Publishing (no token: npm trusts this
# workflow in baccaraaa/tavero via GitHub's OIDC) and updates the entry in the official MCP Registry.

on:
  push:
    tags: ['v*']
  # a manual run publishes the version in package.json from the chosen branch
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusts this workflow only in this environment (Trusted Publisher settings on npmjs.com)
    environment: tavero-git
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: package.json, server.json and the tag agree on the version
        run: |
          v="v$(node -p "require('./package.json').version")"
          s="v$(node -p "require('./server.json').version")"
          test "$v" = "$s"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test "$v" = "$GITHUB_REF_NAME"; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run test/unit
      # Trusted Publishing needs npm 11.5.1 or later; the build and tests run on Node 22 like CI
      - run: npm install -g npm@^11.5.1
      # a rerun skips a version that is already on npm, so a failed registry step can simply be run again
      - name: Publish to npm
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "tavero@$v" version >/dev/null 2>&1; then echo "tavero@$v is already on npm"; else npm publish --access public --provenance; fi
      - name: Update the MCP Registry
        run: |
          v="$(node -p "require('./package.json').version")"
          # the registry checks npm, which takes a moment to serve a new version
          for i in $(seq 1 30); do npm view "tavero@$v" version >/dev/null 2>&1 && break; sleep 10; done
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1
